["General Settings"]
	#Show item descriptions
	showDescriptions = false
	#Apply armor effects
	applyArmorEffects = true
	#Apply attribute modifiers
	applyModifiers = true
	#Render custom capes attached to chestplates
	showCapes = true
	#Do not make capes static if Epic Fight is loaded. It is not implemented yet completely
	epicFightNotStaticCapes = false
	#Show effect particles
	showParticles = false
	#The minimum duration of the existing effect, after which it will be given again
	# Default: 241
	# Range: > 1
	effectsInterval = 241
	#Show effect icon or not
	showEffectIcon = true
	#Enable durability on Fantasy Armor pieces. When false, armor is indestructible. Requires game restart.
	enableDurability = false
